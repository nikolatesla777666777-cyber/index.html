<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анонимная группа</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Unbounded:wght@300;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --glow: rgba(124,58,237,0.3);
    --text: #e2e8f0;
    --muted: #64748b;
    --bubble-own: #1e1040;
    --bubble-other: #141424;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Шум-текстура */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  header {
    position: relative;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    backdrop-filter: blur(10px);
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 12px var(--accent2);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .header-info { flex: 1; }

  .header-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-transform: uppercase;
  }

  .header-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .members-badge {
    font-size: 10px;
    color: var(--accent2);
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.25);
    border-radius: 20px;
    padding: 3px 10px;
  }

  /* Сообщения */
  #messages {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    animation: msgIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to { opacity: 1; transform: none; }
  }

  .msg.own { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }

  .msg-meta {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .anon-name {
    color: var(--accent);
    font-weight: 500;
  }

  .msg.own .anon-name { color: var(--accent2); }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
    position: relative;
  }

  .msg.own .bubble {
    background: var(--bubble-own);
    border: 1px solid rgba(124,58,237,0.3);
    border-bottom-right-radius: 4px;
    box-shadow: 0 0 20px rgba(124,58,237,0.12);
  }

  .msg.other .bubble {
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  /* Медиа в сообщениях */
  .bubble img, .bubble video {
    max-width: 260px;
    max-height: 320px;
    border-radius: 8px;
    display: block;
    cursor: pointer;
    object-fit: cover;
    transition: transform 0.2s;
    margin-top: 4px;
  }
  .bubble img:first-child, .bubble video:first-child { margin-top: 0; }
  .bubble img:hover, .bubble video:hover { transform: scale(1.02); }

  .media-text { margin-top: 6px; }

  /* Системное сообщение */
  .sys-msg {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    padding: 6px 0;
    letter-spacing: 0.05em;
  }

  /* Зона предпросмотра медиа */
  #preview-zone {
    position: relative;
    z-index: 10;
    display: none;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  #preview-zone.active { display: flex; }

  .preview-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    width: 72px; height: 72px;
  }

  .preview-item img, .preview-item video {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .preview-remove {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    border: none;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* Поле ввода */
  #input-bar {
    position: relative;
    z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .btn-attach {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 16px;
  }

  .btn-attach:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,58,237,0.08);
  }

  #text-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    resize: none;
    min-height: 40px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
    overflow-y: auto;
  }

  #text-input:focus { border-color: var(--accent); }
  #text-input::placeholder { color: var(--muted); }

  #text-input::-webkit-scrollbar { width: 3px; }
  #text-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .btn-send {
    width: 40px; height: 40px;
    flex-shrink: 0;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
    box-shadow: 0 0 16px var(--glow);
  }

  .btn-send:hover { background: #6d28d9; transform: scale(1.05); }
  .btn-send:active { transform: scale(0.95); }

  /* Лайтбокс */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    animation: fadeIn 0.2s;
  }

  #lightbox.open { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #lightbox img, #lightbox video {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 10px;
    object-fit: contain;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }

  #lightbox-close {
    position: fixed;
    top: 16px; right: 20px;
    font-size: 26px;
    color: #fff;
    cursor: pointer;
    opacity: 0.7;
    line-height: 1;
    background: none;
    border: none;
    transition: opacity 0.2s;
  }

  #lightbox-close:hover { opacity: 1; }

  /* Моб-адаптив */
  @media (max-width: 480px) {
    .msg { max-width: 90%; }
    .bubble img, .bubble video { max-width: 200px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <div class="header-info">
    <div class="header-title">Анонимная группа</div>
    <div class="header-sub">Все сообщения анонимны · без регистрации</div>
  </div>
  <div class="members-badge" id="members-badge">● онлайн</div>
  <button id="btn-clear" title="Очистить чат" style="background:none;border:1px solid #3a3a5a;color:#64748b;border-radius:8px;padding:4px 8px;font-size:10px;cursor:pointer;">🗑</button>
</header>

<div id="messages">
  <div class="sys-msg">— Добро пожаловать. Здесь всё анонимно. —</div>
</div>

<div id="preview-zone"></div>

<div id="input-bar">
  <label class="btn-attach" id="btn-attach" title="Прикрепить фото или видео" for="file-input">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </label>
  <input type="file" id="file-input" accept="image/*,video/*" multiple style="opacity:0;position:absolute;width:0;height:0;pointer-events:none">
  <textarea id="text-input" placeholder="Написать анонимно..." rows="1"></textarea>
  <button class="btn-send" id="btn-send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<!-- Лайтбокс -->
<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <div id="lightbox-content"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";



const firebaseConfig = {
  apiKey: "AIzaSyDZnr00GCxj9hnfB0xSb7WgUbvU1dJie1Q",
  authDomain: "anonymno9-bdeaa.firebaseapp.com",
  databaseURL: "https://anonymno9-bdeaa-default-rtdb.firebaseio.com",
  projectId: "anonymno9-bdeaa",
  storageBucket: "anonymno9-bdeaa.firebasestorage.app",
  messagingSenderId: "1066433094405",
  appId: "1:1066433094405:web:d7699969ff6111f5a7cd6c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const msgsRef = ref(db, 'messages');

const MY_NAME = 'Ярослав';
let pendingFiles = [];
const renderedIds = new Set();

const messagesEl = document.getElementById('messages');

document.getElementById('members-badge').textContent = '● Ярослав';

// ─── Утилиты ──────────────────────────────────────────────────────────────
function timeStr() {
  return new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ─── Рендер одного сообщения ──────────────────────────────────────────────
function renderMessage(msg, id) {
  if (renderedIds.has(id)) return;
  renderedIds.add(id);

  const isOwn = msg.deviceId === getDeviceId();
  const div = document.createElement('div');
  div.className = 'msg ' + (isOwn ? 'own' : 'other');

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="anon-name">${escHtml(msg.author)}</span><span>${escHtml(msg.time)}</span>`;
  div.appendChild(meta);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (msg.media && msg.media.length > 0) {
    msg.media.forEach(m => {
      if (m.type === 'image') {
        const img = document.createElement('img');
        img.src = m.url;
        img.alt = 'фото';
        img.loading = 'lazy';
        img.onclick = () => openLightbox('img', m.url);
        bubble.appendChild(img);
      } else if (m.type === 'video') {
        const vid = document.createElement('video');
        vid.src = m.url;
        vid.controls = true;
        vid.preload = 'metadata';
        bubble.appendChild(vid);
      }
    });
  }

  if (msg.text && msg.text.trim()) {
    const t = document.createElement('div');
    if (msg.media && msg.media.length > 0) t.className = 'media-text';
    t.textContent = msg.text;
    bubble.appendChild(t);
  }

  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ─── Уникальный ID устройства (чтобы «свои» пузыри отличать) ──────────────
function getDeviceId() {
  let id = localStorage.getItem('_dev_id');
  if (!id) { id = Math.random().toString(36).slice(2); localStorage.setItem('_dev_id', id); }
  return id;
}

// ─── Слушаем Firebase — последние 100 сообщений + новые ───────────────────
const recentQuery = query(msgsRef, limitToLast(100));
onChildAdded(recentQuery, (snapshot) => {
  renderMessage(snapshot.val(), snapshot.key);
});

// ─── Отправка ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = document.getElementById('text-input').value.trim();
  if (!text && pendingFiles.length === 0) return;

  const media = [];
  for (const f of pendingFiles) {
    const url = await readFileAsDataURL(f);
    media.push({ type: f.type.startsWith('video') ? 'video' : 'image', url });
  }

  const msg = {
    author: MY_NAME,
    deviceId: getDeviceId(),
    text: text,
    media: media,
    time: timeStr(),
    ts: Date.now()
  };

  try {
    await push(msgsRef, msg);
  } catch(e) {
    alert('Ошибка отправки: ' + e.message);
    return;
  }

  document.getElementById('text-input').value = '';
  document.getElementById('text-input').style.height = '';
  pendingFiles = [];
  updatePreview();
}

// ─── Предпросмотр медиа ───────────────────────────────────────────────────
function updatePreview() {
  const zone = document.getElementById('preview-zone');
  zone.innerHTML = '';
  if (pendingFiles.length === 0) { zone.classList.remove('active'); return; }
  zone.classList.add('active');

  pendingFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const url = URL.createObjectURL(f);
    if (f.type.startsWith('video')) {
      const v = document.createElement('video');
      v.src = url; v.muted = true;
      item.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = url;
      item.appendChild(img);
    }
    const btn = document.createElement('button');
    btn.className = 'preview-remove';
    btn.textContent = '✕';
    btn.onclick = () => { pendingFiles.splice(i, 1); updatePreview(); };
    item.appendChild(btn);
    zone.appendChild(item);
  });
}

// ─── Лайтбокс ─────────────────────────────────────────────────────────────
function openLightbox(type, src) {
  const lb = document.getElementById('lightbox');
  const cnt = document.getElementById('lightbox-content');
  cnt.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  cnt.appendChild(img);
  lb.classList.add('open');
  document.addEventListener('keydown', closeLbOnEsc);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', closeLbOnEsc);
}
function closeLbOnEsc(e) { if (e.key === 'Escape') closeLightbox(); }
document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLightbox(); });
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

// ─── Textarea авто-рост ───────────────────────────────────────────────────
const ta = document.getElementById('text-input');
ta.addEventListener('input', () => { ta.style.height = ''; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; });
ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ─── Файлы ────────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', (e) => {
  pendingFiles.push(...Array.from(e.target.files || []));
  updatePreview();
  e.target.value = '';
});

messagesEl.addEventListener('dragover', e => e.preventDefault());
messagesEl.addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image') || f.type.startsWith('video'));
  if (files.length) { pendingFiles.push(...files); updatePreview(); }
});

document.getElementById('btn-send').addEventListener('click', sendMessage);

// ─── Очистка чата ─────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', async () => {
  if (!confirm('Удалить все сообщения?')) return;
  await remove(msgsRef);
  messagesEl.innerHTML = '<div class="sys-msg">— Добро пожаловать. Здесь всё анонимно. —</div>';
  renderedIds.clear();
});
</script>
</body>
</html>
